[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-portfolio"
version = "0.1.0"
description = "A small command-line program for the CDS212 DevOps module at FH Graubünden."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pytest>=9.1.1",
]

[project.scripts]
devops-portfolio = "devops_portfolio.app:main"
